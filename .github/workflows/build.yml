name: Ubuntu 24.04 build

on:
  push:
    branches: [zedas-easy-mode]
  pull_request:
    branches: [zedas-easy-mode]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build libboost-system-dev libboost-filesystem-dev libpugixml-dev libluajit-5.1-dev luajit default-libmysqlclient-dev libgmp-dev python3
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUSE_LUAJIT=ON -DLUA_INCLUDE_DIR=/usr/include/luajit-2.1
      - name: Compile
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
